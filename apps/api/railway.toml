[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm run build"

[deploy]
startCommand = "pnpm run db:deploy && node dist/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Tell Railway which endpoint to probe after deploy to confirm the service is healthy.
# Timeout of 300s gives Prisma migrations time to complete on first boot.
healthcheckPath = "/health"
healthcheckTimeout = 300

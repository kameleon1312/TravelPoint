name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type-check ───────────────────────────────────────────────────────────────
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Generate Prisma client
        run: pnpm --filter @travelpoint/api db:generate

      - name: Type-check API
        run: pnpm --filter @travelpoint/api type-check

      - name: Type-check Web
        run: pnpm --filter @travelpoint/web type-check

      - name: Type-check Mobile
        run: pnpm --filter @travelpoint/mobile type-check

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Generate Prisma client
        run: pnpm --filter @travelpoint/api db:generate

      - name: Lint API
        run: pnpm --filter @travelpoint/api lint

      - name: Lint Web
        run: pnpm --filter @travelpoint/web lint

      - name: Lint Mobile
        run: pnpm --filter @travelpoint/mobile lint

      - name: Validate Mobile release config
        run: pnpm --filter @travelpoint/mobile config:check

  # ── Security tests ───────────────────────────────────────────────────────────
  test-api:
    name: API security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Generate Prisma client
        run: pnpm --filter @travelpoint/api db:generate

      - name: Run API tests
        run: pnpm --filter @travelpoint/api test

  # ── Build web (smoke test) ────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      # Minimal env so Next.js build doesn't crash on missing vars
      NEXT_PUBLIC_API_URL: https://travelpointapi-production.up.railway.app
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Build Web
        run: pnpm --filter @travelpoint/web build

  # ── Migration drift check ─────────────────────────────────────────────────────
  migration-check:
    name: Migration drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @travelpoint/api db:generate

      - name: Check for unapplied migrations
        # Exits with code 1 if schema.prisma is out of sync with migrations folder
        run: pnpm --filter @travelpoint/api exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code || (echo "Schema drift detected — run prisma migrate dev to generate a migration" && exit 1)
        env:
          SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
        continue-on-error: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: pnpm security:secrets

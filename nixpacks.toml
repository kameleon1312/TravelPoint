# Railway / Nixpacks build config for the API service.
# Railway should be pointed at the ROOT of the repo with this file.

[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.pnpm", "nodePackages.node-gyp", "python3", "gnumake", "gcc"]
cmds = ["corepack enable && corepack prepare pnpm@11.0.8 --activate"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @travelpoint/api build"]

[start]
cmd = "pnpm --filter @travelpoint/api db:deploy && pnpm --filter @travelpoint/api start"

# Railway / Nixpacks build config for the API service.
# Railway should be pointed at the ROOT of the repo with this file.

[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["npm install -g pnpm@11"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @travelpoint/api db:generate",
  "pnpm --filter @travelpoint/api db:deploy",
  "pnpm --filter @travelpoint/api build"
]

[start]
cmd = "node apps/api/dist/server.js"
